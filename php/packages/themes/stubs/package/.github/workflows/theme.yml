# The theme's own CI: dist/ is built from the committed src/, and the contract is green.
# dist/ is committed because a site installs the theme from Composer and has no Node to build it.

name: Theme

on:
  push:
  pull_request:

jobs:
  dist:
    name: dist/ is built from src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Nothing to commit
        run: git diff --exit-code -- dist

  test:
    name: The theme's contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
