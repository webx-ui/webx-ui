<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="400" viewBox="0 0 4000 400">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#456" />
      <stop offset="1" stop-color="#123" />
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="20" height="40" fill="#fff" fill-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="4000" height="400" fill="url(#fade)" />
  <rect width="4000" height="400" fill="url(#stripes)" />
</svg>
