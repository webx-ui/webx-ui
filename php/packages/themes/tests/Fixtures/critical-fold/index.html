<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A short page</title>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <header class="site-header">Site</header>
    <main class="site-main">
      <h1 class="page-title">A short page</h1>
      <section class="b-text">
        <p>One block of text, and the footer starts in the first screen.</p>
      </section>
    </main>
    <footer class="site-footer">
      <img class="site-footer__texture" src="/texture.svg" alt="" />
      <div class="site-footer__columns">
        <p class="site-footer__column">Contacts</p>
        <p class="site-footer__column">Address</p>
      </div>
      <div class="site-footer__bottom">
        <span>All rights reserved</span>
        <span>Privacy</span>
      </div>
    </footer>
    <aside class="site-note">A note below the footer</aside>
  </body>
</html>
