worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Room for what the media library accepts; php.ini says the same number twice, and the
    # smaller of the three is the one that decides.
    client_max_body_size 105m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Built assets are named by their content, so they can be cached until the heat death
        # of the universe; everything else here is answered by PHP.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # The same for what `php artisan webx:theme:sync` publishes — the theme layers' files,
        # the modules' stylesheet, the icon sprite: every path carries a hash of its content.
        location /themes/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # What people uploaded (the media library's public disk): never sniffed into another
        # type, and an SVG — a document that can run scripts — allowed to draw and nothing else.
        # `add_header` in a nested location drops the outer ones, hence twice. A missing file
        # still goes to PHP: an old key of a converted picture answers with a 301 there.
        location /storage/ {
            add_header X-Content-Type-Options nosniff always;

            location ~* \.svg$ {
                add_header X-Content-Type-Options nosniff always;
                add_header Content-Security-Policy "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox" always;
                try_files $uri /index.php?$query_string;
            }

            try_files $uri /index.php?$query_string;
        }

        # Every public address of this site comes out of the address registry, and the panel
        # is one page whose routing belongs to the front end: both end up at index.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }

    # TLS ends at the proxy in front, so PHP only learns the scheme from a header. Without
    # this the panel builds http:// URLs and the secure session cookie is never set — which
    # looks like signing in not working rather than like a missing header.
    map $http_x_forwarded_proto $forwarded_https {
        default "";
        https "on";
    }
}
