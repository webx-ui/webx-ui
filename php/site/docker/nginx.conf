worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Room for what the media library accepts; php.ini says the same number twice, and the
    # smaller of the three is the one that decides.
    client_max_body_size 105m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Built assets are named by their content, so they can be cached until the heat death
        # of the universe; everything else here is answered by PHP.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Every public address of this site comes out of the address registry, and the panel
        # is one page whose routing belongs to the front end: both end up at index.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }

    # TLS ends at the proxy in front, so PHP only learns the scheme from a header. Without
    # this the panel builds http:// URLs and the secure session cookie is never set — which
    # looks like signing in not working rather than like a missing header.
    map $http_x_forwarded_proto $forwarded_https {
        default "";
        https "on";
    }
}
