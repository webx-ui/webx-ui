; The development container: the same runtime, told that the files under it do change.
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 105M
max_execution_time = 0
max_input_time = 120

; Without this an edit in the editor is invisible to the container until it restarts — the
; same file cached by opcache, which is exactly right in production and exactly wrong here.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
error_reporting = E_ALL
