; Four processes in one container: the server, the worker and the clock.
;
; The scheduler is here rather than in a container of its own, and that is a decision with a
; limit attached: run a second copy of this container and the schedule runs twice — the
; nightly database dump among it. A site that scales past one app container takes the
; scheduler out of this file and gives it a service instead, running as the same user.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; No driver named: the queue is whatever QUEUE_CONNECTION says, which on a site that has not
; been given a Redis is the database.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

; The same user the application runs as. Laravel creates the backup directory 0700, so a
; scheduler running as root writes dumps php-fpm cannot even list: the files are there, the
; panel's "last snapshot" line stays empty, and nothing anywhere reports an error.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
