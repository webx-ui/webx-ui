name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
  # Required by the merge queue: a PR is checked against main without its neighbours, and two
  # green PRs have made main red before. The queue builds them together.
  merge_group:
  # The full run a pull request may have skipped, once a day.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: php-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: php

# A pull request and the merge queue test only the packages the change reaches — the changed
# ones and every package that requires them, by `require` in composer.json (see
# scripts/affected.mjs). The decision is made inside the job, not with `paths-ignore` or a job
# in front of it: the ruleset requires these two checks by name, and a check that never starts,
# or is skipped because the job before it failed, either stalls the queue or passes unseen.
# With nothing to test every step below is skipped and the check reports green.

jobs:
  verify:
    name: PHP lint, analyse, test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the base
        if: env.BASE != ''
        run: git fetch --no-tags --depth=1 origin "$BASE"

      - name: What the change reaches
        id: affected
        run: node ../scripts/affected.mjs --php "$BASE"

      - uses: shivammathur/setup-php@v2
        if: steps.affected.outputs.php != 'none'
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      # The manifests read the same on every PHP.
      - name: Validate manifests
        if: steps.affected.outputs.php != 'none' && matrix.php == '8.4'
        run: |
          composer validate --no-check-all --no-check-publish
          for manifest in packages/*/composer.json; do
            ( cd "$(dirname "$manifest")" && composer validate --strict )
          done

      - name: Cache Composer downloads
        if: steps.affected.outputs.php != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('php/packages/*/composer.json', 'php/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        if: steps.affected.outputs.php != 'none'
        run: composer install --no-interaction --no-progress

      # Style and static analysis do not depend on the runtime the tests run on, so they run once,
      # on the lowest PHP the packages support — the version PHPStan should reason about. Both
      # keep a cache keyed by file content: a fresh checkout reuses it and only what changed is
      # looked at again (a cold Pint takes over a minute, a warm one seconds; PHPStan alike).
      - name: Restore the lint and analysis caches
        if: steps.affected.outputs.php != 'none' && matrix.php == '8.4'
        uses: actions/cache@v4
        with:
          path: |
            php/.pint.cache
            php/.phpstan.cache
          key: php-lint-${{ matrix.php }}-${{ github.sha }}
          restore-keys: php-lint-${{ matrix.php }}-

      - name: Lint
        if: steps.affected.outputs.php != 'none' && matrix.php == '8.4'
        run: vendor/bin/pint --test --parallel --cache-file=.pint.cache

      - name: Analyse
        if: steps.affected.outputs.php != 'none' && matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Test
        if: steps.affected.outputs.php != 'none'
        run: vendor/bin/phpunit ${{ steps.affected.outputs.php_tests }}
