name: PHP CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: php-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: php

jobs:
  verify:
    name: PHP lint, analyse, test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate manifests
        run: |
          composer validate --no-check-all --no-check-publish
          for manifest in packages/*/composer.json; do
            ( cd "$(dirname "$manifest")" && composer validate --strict )
          done

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('php/packages/*/composer.json', 'php/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: vendor/bin/pint --test

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

      - name: Test
        run: vendor/bin/phpunit
