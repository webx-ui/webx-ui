name: PHP smoke

# Shallow and broad, where php-ci.yml is deep and narrow. The tests run under Testbench, where
# the providers are wired by hand, the database is sqlite in memory and CSRF is switched off —
# so nothing there can notice a bad provider declaration, a migration that only works on
# sqlite, a sign-in that cannot get past CSRF, or a panel that falls open once a deploy runs
# config:cache.

on:
  # Nightly rather than on every push to main: a run takes a runner for minutes, and on a release
  # day it took one from the release itself. An hour after ci.yml and php-ci.yml, not with them.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  # Not a required check, so a path filter is safe here: a pull request that leaves the Composer
  # half alone has nothing to install.
  pull_request:
    paths:
      - 'php/**'
      - 'scripts/php-smoke.sh'
      - '.github/workflows/php-smoke.yml'

concurrency:
  group: php-smoke-${{ github.ref }}
  cancel-in-progress: true

# Not on the version PR (scripts/release-pr.mjs, the same answer ci.yml and php-ci.yml read): it
# rewrites every composer.json, so the path filter lets it in, yet it only bumps versions on top
# of code the day's pull request already ran through here — and the smoke was the last check of
# the release to go green. Not required by the ruleset, so the job is skipped outright rather
# than run with nothing in it. The merge queue does not run the smoke at all: no merge_group.
jobs:
  release:
    name: Is it the version PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    outputs:
      light: ${{ steps.release.outputs.light }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the base
        run: git fetch --no-tags --depth=1 origin "$BASE"
      - name: Is it the version PR
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: node scripts/release-pr.mjs "$BASE"

  smoke:
    name: Install into a real Laravel app
    needs: release
    # On schedule and dispatch the job above is skipped and leaves no answer, so the smoke runs;
    # if it fails, the smoke runs too — the full run is never wrong, only slower.
    if: ${{ !cancelled() && needs.release.outputs.light != 'true' }}
    runs-on: ubuntu-latest

    services:
      mariadb:
        # The database the sites actually run on, rather than the one the tests are fast on.
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: webx
          MARIADB_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      # The platform scenario runs `webx:setup` with the build, the way a platform does: the
      # image installs the front end from the lock file that build writes.
      # v5 caches by the root `packageManager` (pnpm) on its own and fails without pnpm on PATH;
      # the scenario installs with npm in a site of its own, so there is nothing to cache.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: smoke-${{ hashFiles('php/packages/*/composer.json') }}
          restore-keys: smoke-

      - name: Install the packages into a Laravel application and use it
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: webx
          DB_USERNAME: root
          DB_PASSWORD: secret
          SMOKE_DIR: ${{ runner.temp }}/smoke
          # Docker is on the runner, so the scenario that builds the image is not optional here.
          SMOKE_PLATFORM: '1'
        run: bash scripts/php-smoke.sh
