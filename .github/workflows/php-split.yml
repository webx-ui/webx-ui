name: PHP split

# Packagist installs a package from its own repository, so every package under php/packages
# is mirrored, read-only, into github.com/webx-ui/<package>. A push to main keeps the mirror
# current; a tag is what Composer actually resolves as a release.

on:
  push:
    branches: [main]
    paths:
      - 'php/**'
      - '.github/workflows/php-split.yml'
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to create in the split repositories, e.g. v0.1.0'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create in the split repositories, e.g. v0.1.0'
        required: false
        type: string
        default: ''

concurrency:
  group: php-split-${{ github.ref }}
  # A release pushes the branch and the tag in two runs; cancelling one of them would leave
  # a mirror half updated.
  cancel-in-progress: false

jobs:
  packages:
    name: Collect packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # The directory listing is the source of truth: a new package needs no workflow edit,
      # only a repository with a matching name.
      - id: collect
        name: Read php/packages
        run: |
          matrix=$(for manifest in php/packages/*/composer.json; do
            directory=$(basename "$(dirname "$manifest")")
            repository=$(jq -r '.name | sub("^webx-ui/"; "")' "$manifest")
            jq -n --arg directory "$directory" --arg repository "$repository" \
              '{directory: $directory, repository: $repository}'
          done | jq -s -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  split:
    name: Split ${{ matrix.package.repository }}
    needs: packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A GitHub App rather than a personal token: it never expires, it does not hang off one
      # person's account, and a new mirror needs nothing here — the App is installed org-wide and
      # this token is narrowed, per job, to the single repository that job pushes to.
      - name: Mint a token for the mirror
        id: mirror-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PHP_SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHP_SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.package.repository }}
          permission-contents: write

      # The split action cannot make the first commit in a mirror: it clones the empty
      # repository, fails to check out the branch, creates it locally and then pushes nothing
      # ("src refspec main does not match any"). Give it a branch to land on.
      - name: Seed an empty mirror
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          REPOSITORY: webx-ui/${{ matrix.package.repository }}
        run: |
          if gh api "repos/$REPOSITORY/branches/main" --silent 2>/dev/null; then
            echo "$REPOSITORY already has main."
            exit 0
          fi

          readme=$(printf '# %s\n\nRead-only split of https://github.com/webx-ui/webx-ui.\n' \
            "${{ matrix.package.repository }}" | base64 -w0)

          gh api "repos/$REPOSITORY/contents/README.md" \
            --method PUT \
            --field message="Initial commit" \
            --field branch=main \
            --field content="$readme"

          echo "Seeded $REPOSITORY with an initial commit."

      - name: Sync the mirror
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          # The action builds `https://<token>@github.com/...`, which puts the token in the
          # username. A personal token works that way; a GitHub App installation token has to
          # be the password, so git otherwise stops and asks for one — and the only sign of it
          # is "could not read Password" at the push. Naming the username makes both work.
          GITHUB_TOKEN: x-access-token:${{ steps.mirror-token.outputs.token }}
        with:
          package_directory: php/packages/${{ matrix.package.directory }}
          repository_organization: webx-ui
          repository_name: ${{ matrix.package.repository }}
          user_name: webx-ui-bot
          user_email: bot@webx-ui.dev

      # The action's own `tag` input pushes from a directory whose remote carries no
      # credentials as soon as the package itself has not changed — "could not read Password"
      # — which is exactly the shape of a release that only bumps the shared version. Creating
      # the ref over the API is both immune to that and easier to read: the tag lands on the
      # mirror's main, which the step above has just made current.
      - name: Tag the mirror
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
          REPOSITORY: webx-ui/${{ matrix.package.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$REPOSITORY is already tagged $TAG."
            exit 0
          fi

          sha=$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')

          gh api "repos/$REPOSITORY/git/refs" \
            --method POST \
            --field ref="refs/tags/$TAG" \
            --field sha="$sha" \
            --silent

          echo "Tagged $REPOSITORY $TAG at $sha."
