name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds main plus the PR and needs the required check to report on it.
  merge_group:
  # The full run a pull request may have skipped, once a day, so that nothing rots unseen.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The steps used to run one after another in a single job (6.5 minutes). Only typecheck, the
# tests and the docs need the packages built — the docs and the module tests resolve their
# neighbours from `dist` — so lint and format start at once, and every job builds for itself:
# shipping `dist` between jobs as an artifact costs about what building it does.
#
# The version PR is the exception. It changes versions, changelogs and the PHP constraints on
# top of a main that already passed this workflow — and the merge queue keeps main green by
# construction — so it only has to prove that it still installs and builds.
#
# A pull request and the merge queue check only what the change reaches: `changes` runs
# scripts/affected.mjs against the base and the jobs below read its answer. A text-only change
# runs lint alone; the jobs it skips still leave `verify` green, which is why a skip is decided
# here and never with `paths-ignore` — a workflow that does not start reports no check at all,
# and the queue waits for the required one forever. A push to main and the nightly run have no
# base and check everything.

jobs:
  changes:
    name: What the change reaches
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    outputs:
      node: ${{ steps.affected.outputs.node }}
      node_filters: ${{ steps.affected.outputs.node_filters }}
      node_tests: ${{ steps.affected.outputs.node_tests }}
      docs: ${{ steps.affected.outputs.docs }}
      manticore: ${{ steps.affected.outputs.manticore }}
    steps:
      - uses: actions/checkout@v5
      # `pnpm ls --filter ...[<base>]` reads manifests only: no install needed.
      - uses: pnpm/action-setup@v4
      - name: Fetch the base
        if: env.BASE != ''
        run: git fetch --no-tags --depth=1 origin "$BASE"
      - id: affected
        run: node scripts/affected.mjs "$BASE"

  lint:
    name: Lint and format
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check generated tokens are up to date
        run: |
          pnpm --filter @webx-ui/tokens generate
          git diff --exit-code -- packages/tokens/src/generated \
            || (echo "::error::packages/tokens/src/generated is stale — run 'pnpm --filter @webx-ui/tokens generate' and commit the result" && exit 1)

      # Both caches key a file by its content, so a fresh checkout reuses them: an unchanged file
      # is not linted or formatted again. Neither linter reads types across files, so a file that
      # did not change cannot have changed its verdict either.
      - name: Restore the lint caches
        uses: actions/cache@v4
        with:
          path: .cache/lint
          key: lint-${{ github.sha }}
          restore-keys: lint-
      - run: pnpm lint --cache --cache-strategy content --cache-location .cache/lint/eslint
      - run: pnpm format:check --cache --cache-strategy content --cache-location .cache/lint/prettier

  # Two shards for the whole workspace, one for the few projects a change reaches. Each shard
  # builds everything — a checked project reads its dependencies' declarations — and checks every
  # other project; the projects cost about the same, so alternating splits them evenly. A
  # single pass that checked each package as soon as it was built was tried and saved nothing.
  typecheck:
    name: Typecheck ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.node != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.node == 'all' && '[1, 2]' || '[1]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Typecheck this shard's projects
        env:
          FILTERS: ${{ needs.changes.outputs.node == 'some' && needs.changes.outputs.node_filters || '' }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          pick='
            const projects = JSON.parse(require("fs").readFileSync(0, "utf8"))
              .filter((project) => project.name.startsWith("@webx-ui/") && project.name !== "@webx-ui/php")
            const mine = projects.filter((_, index) => index % process.env.TOTAL === process.env.SHARD - 1)
            console.log(mine.map((project) => `--filter ${project.name}`).join(" "))'
          # $FILTERS and the answer are lists of flags: word splitting is the point.
          filters=$(pnpm ls -r --depth -1 --json $FILTERS | node -e "$pick")
          pnpm $filters typecheck

  # Three shards for the whole suite; the few packages a change reaches fit in one.
  test:
    name: Test ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.node != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.node == 'all' && '[1, 2, 3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The JS alone: declarations are two thirds of the build and nothing here reads them.
      - run: pnpm build
        env:
          WEBX_SKIP_DTS: 1
      - if: needs.changes.outputs.node == 'all'
        run: pnpm test --shard=${{ matrix.shard }}/3
      # Vitest path filters; empty when only an app changed, and the apps have no unit tests.
      - if: needs.changes.outputs.node == 'some' && needs.changes.outputs.node_tests != ''
        run: pnpm test ${{ needs.changes.outputs.node_tests }}

  docs:
    name: Build docs
    needs: changes
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The JS alone: declarations are two thirds of the build and nothing here reads them.
      - run: pnpm build
        env:
          WEBX_SKIP_DTS: 1
      - run: pnpm docs:build

  release-pr:
    name: Version PR installs and builds
    if: github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # The ranges `workspace:^` turns into are what a version PR can break.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # The catalogue's engine tests against a real Manticore (decision 26 of the Manticore spec): the
  # same scenarios as the database engine, with `--fail-on-skipped` so that a server that never
  # came up fails here instead of skipping quietly. EXTRA brings the lemmatizer dictionaries.
  manticore:
    name: PHP on Manticore
    needs: changes
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.manticore == 'true'
    runs-on: ubuntu-latest
    services:
      manticore:
        image: manticoresearch/manticore:29.0.2
        env:
          EXTRA: 1
        ports:
          - 9308:9308
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-8.4-${{ hashFiles('php/packages/*/composer.json', 'php/composer.json') }}
          restore-keys: composer-8.4-
      - run: composer install --no-interaction --no-progress
      - name: Wait for Manticore
        run: |
          for attempt in $(seq 1 90); do
            curl -sf 'http://127.0.0.1:9308/sql?mode=raw' --data-urlencode 'query=SHOW VERSION' && exit 0
            sleep 2
          done
          echo '::error::Manticore did not come up.' && exit 1
      - name: Test
        env:
          MANTICORE_TEST_HOST: 127.0.0.1
          MANTICORE_TEST_PORT: 9308
        run: vendor/bin/phpunit --fail-on-skipped packages/module-catalog-manticore/tests

  # Names of client projects never go public. The list is the leak, so it lives in the
  # FORBIDDEN_NAMES secret and nowhere in the code; a fork has no secret and the script passes.
  # The tree is checked always, the messages of what the run brings in — when it brings any.
  names:
    name: No client names
    runs-on: ubuntu-latest
    env:
      WEBX_FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
      RANGE_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      RANGE_TO: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tree
        run: node scripts/check-names.mjs
      - name: The commit messages
        if: env.RANGE_FROM != '' && env.RANGE_FROM != '0000000000000000000000000000000000000000'
        run: node scripts/check-names.mjs --commits "$RANGE_FROM..$RANGE_TO"
      - name: The pull request's title and body
        if: github.event_name == 'pull_request'
        run: |
          printf '%s' "$PR_TEXT" > "$RUNNER_TEMP/pr.txt"
          node scripts/check-names.mjs --message "$RUNNER_TEMP/pr.txt"

  # The ruleset requires a check by this name, so it stays the one name the rest report into.
  # `always()` is the point: without it a failed job makes this one skipped, and GitHub counts
  # a skipped required check as passed. Skipped jobs are fine — that is the version PR's path and
  # the path of everything a change does not reach.
  verify:
    name: Lint, typecheck, test, build
    needs: [changes, names, lint, typecheck, test, docs, manticore, release-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was meant to be skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A job above failed or was cancelled."
            exit 1
          fi
