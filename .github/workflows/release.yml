name: Release

on:
  push:
    branches: [main]
  # The `next` channel: a snapshot of any branch for the demo sites, without a release.
  workflow_dispatch:
    inputs:
      verify:
        description: 'Run typecheck and the tests before publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm Trusted Publishing (OIDC) — no NPM_TOKEN is stored anywhere.
  id-token: write

jobs:
  release:
    name: Version or publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      php_version: ${{ steps.php_tag.outputs.version }}
    steps:
      # The organisation's App rather than GITHUB_TOKEN: a branch pushed with GITHUB_TOKEN starts
      # no workflows, so the version PR's CI used to wait in `action_required` for somebody to
      # approve it by hand. Checkout keeps the token, so every push below is the App's.
      - name: Mint a token for the version PR
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PHP_SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHP_SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: webx-ui
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build here: opening the version PR needs none, and `pnpm release` builds before it
      # publishes — building twice cost a minute on every run.

      # Composer has no registry to publish to: a version exists once the tag exists. The npm
      # packages get their tags from changesets, the PHP ones share a single version carried by
      # the private php/package.json, so the tag for them is cut here.
      #
      # Before changesets/action on purpose. When changesets has work to do it bumps the version
      # and commits it, so afterwards neither the working tree nor HEAD is what was pushed to
      # main any more — and tagging that announces a release nobody has merged, on a commit that
      # may never land.
      - name: Tag the PHP packages
        id: php_tag
        run: |
          version=$(node -p "require('./php/package.json').version")

          if [ "$version" = "0.0.0" ]; then
            echo "No PHP release has been cut yet — skipping."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/php-v$version" >/dev/null; then
            echo "php-v$version already exists — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "php-v$version" -m "php-v$version"
          git push origin "php-v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Opens (or updates) the "Version packages" PR when changesets are pending;
      # publishes to npm when that PR is merged.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

  # A snapshot of the dispatched branch under the npm dist-tag `next`, and the PHP packages as
  # the branch `next` of every mirror (`dev-next` on Packagist). No version PR, no git tags,
  # `latest` untouched. It lives in this file because npm Trusted Publishing is bound to the
  # workflow's file name — a second file would need a second trusted publisher on every package.
  # Only packages with a changeset on the branch (and those depending on them) move; a package
  # that has never been published cannot go this way — Trusted Publishing does not create names.
  next:
    name: Publish a snapshot to next
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        if: inputs.verify
        run: pnpm build && pnpm typecheck && pnpm test

      # `useCalculatedVersion` in .changeset/config.json names the snapshot 0.33.3-next-<time>
      # rather than 0.0.0-next-<time>, which the neighbours' `^0.33.0` would not accept. Nothing
      # of this is committed. sync-php-version is not run: Composer cannot parse a
      # prerelease constraint like that, so the PHP constraints stay as they are on the branch.
      - name: Version as a snapshot
        run: pnpm changeset version --snapshot next

      - name: Publish under next
        run: pnpm build && pnpm changeset publish --tag next --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: What was published
        run: |
          for manifest in packages/*/package.json; do
            node -e "const p=require('./$manifest'); if (!p.private && p.version.includes('-next-')) console.log(p.name + '@' + p.version)"
          done

  next-php:
    name: Publish PHP packages to next
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/php-split.yml
    with:
      branch: next
    secrets: inherit

  # Mirrors every PHP package into its own repository and tags it there as v<version>, which
  # is the form Composer and Packagist understand.
  php-split:
    name: Publish PHP packages
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.php_version != ''
    uses: ./.github/workflows/php-split.yml
    with:
      tag: v${{ needs.release.outputs.php_version }}
    secrets: inherit
